<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#192d40;--muted:#63717c;--paper:#f5f3ed;--white:#fffefa;--line:#d7dedd;--accent:#bd513e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}
a{color:#245675;text-decoration-thickness:1px;text-underline-offset:4px;overflow-wrap:anywhere}
button,input{font:inherit}
button{border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid #b36a23;outline-offset:3px}
header{max-width:1240px;margin:auto;padding:64px 32px 28px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.15em;font-weight:650}
h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(30px,5vw,52px);line-height:1.3;margin:14px 0 18px}
.meta{color:var(--muted);font-size:14px;margin:0}
.shell{max-width:1240px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:44px;margin:0 auto;padding:32px}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding:4px 4px 24px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 8px}
input{width:100%;min-width:0;border:1px solid #aab8bd;border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
nav h2{font-size:14px;letter-spacing:.08em;margin:30px 0 10px}
nav ol{margin:0;padding:0;list-style:none}
nav li{margin:0 0 5px}
nav a{display:block;padding:7px 10px;border-left:2px solid transparent;text-decoration:none;color:var(--ink);font-size:14px}
nav a:hover,nav a[aria-current="location"]{border-color:var(--accent);background:#eaece6}
main{min-width:0}
article{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:32px;margin:0 0 28px;scroll-margin-top:24px;overflow-wrap:anywhere}
article h2{font-size:26px;line-height:1.4;margin:0 0 12px}
article h3{font-size:17px;margin:25px 0 8px}
article p{margin:0 0 12px;white-space:pre-wrap}
article ul,article ol{margin:8px 0 16px;padding-left:1.4em}
article li{margin:5px 0;white-space:pre-wrap}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px}
.tag{font-size:12px;line-height:1.7;padding:2px 9px;border-radius:4px;background:#edf1f2;color:#345667}
.judgment{padding:16px 18px;border-left:3px solid var(--accent);background:#f5eee7}
.judgment h3{margin-top:0}
.principles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.principle{padding:12px 14px;background:#f1f4f2;border-radius:6px}
.principle strong{display:block;font-size:13px;color:#41606b;margin-bottom:4px}
.principle p{font-size:14px;margin:0}
pre{font:14px/1.7 ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#edf1f3;padding:16px;border-radius:8px}
.sources{font-size:13px;color:var(--muted)}
.sources small{display:block;color:var(--muted)}
.empty{padding:32px;border:1px dashed #b6c0c3;border-radius:12px;background:var(--white)}
footer{max-width:1240px;margin:auto;padding:10px 32px 40px;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media(max-width:760px){header{padding:32px 20px 20px}.shell{grid-template-columns:1fr;padding:20px;gap:20px}aside{position:static;max-height:none}nav ol{display:flex;flex-wrap:wrap;gap:4px}nav a{font-size:13px}article{padding:22px}article h2{font-size:23px}.principles{grid-template-columns:1fr}}
@media print{body{background:white;font-size:11pt}header{padding:0 0 16px;max-width:none}.shell{display:block;padding:0;max-width:none}aside,.empty,.screen-only{display:none!important}article,article[hidden]{display:block!important;border:0;border-top:1px solid #aaa;border-radius:0;padding:20px 0;margin:0 0 18px;break-before:auto}h2,h3{break-after:avoid}.principles{display:block}.principle{break-inside:avoid;margin:6px 0}.sources{overflow-wrap:anywhere}.source-url{display:block!important;color:#444}footer{padding:10px 0}.judgment{background:#f4f4f4}pre{white-space:pre-wrap}}
.sources .source-url{display:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
<div class="eyebrow">PM 实战导师 · 知识手册</div>
<h1>{{TITLE}}</h1>
<p class="meta">累计 {{COUNT}} 个专题 · 更新于 {{UPDATED}}</p>
</header>
<div class="shell">
<aside aria-label="查找和目录">
<label for="search">查找方法、案例或关键词</label>
<input id="search" type="search" placeholder="输入关键词，支持多个词" autocomplete="off">
<div class="actions"><button id="clear" type="button">清空搜索</button><button id="print" type="button">打印手册</button></div>
<p id="status" class="status" role="status" aria-live="polite">显示全部 {{COUNT}} 个专题</p>
<nav aria-label="专题目录"><h2>专题目录</h2><ol>{{TOC}}</ol></nav>
</aside>
<main id="topics">
<p id="empty" class="empty" hidden>没有找到匹配的专题。换个关键词，或清空搜索查看全部内容。</p>
{{ARTICLES}}
</main>
</div>
<footer>方法随证据与业务条件更新。请结合每个专题的适用边界使用。</footer>
<script>
(() => {
  const input = document.getElementById('search');
  const articles = [...document.querySelectorAll('article[data-topic]')];
  const entries = [...document.querySelectorAll('nav li[data-topic]')];
  const normal = value => value.normalize('NFKC').toLocaleLowerCase();
  const searchable = new Map(articles.map(a => [a.dataset.topic, normal(a.textContent)]));
  function filter() {
    const terms = normal(input.value).trim().split(/\s+/).filter(Boolean);
    let count = 0;
    for (const a of articles) {
      const matched = terms.every(t => searchable.get(a.dataset.topic).includes(t));
      a.hidden = !matched;
      if (matched) count++;
    }
    for (const entry of entries) {
      const a = document.getElementById('topic-' + entry.dataset.topic);
      entry.hidden = a.hidden;
    }
    document.getElementById('empty').hidden = count !== 0;
    document.getElementById('status').textContent =
      terms.length ? '找到 ' + count + ' / ' + articles.length + ' 个专题' : '显示全部 ' + articles.length + ' 个专题';
  }
  input.addEventListener('input', filter);
  document.getElementById('clear').addEventListener('click', () => { input.value = ''; filter(); input.focus(); });
  document.getElementById('print').addEventListener('click', () => window.print());
  function locate() {
    let id;
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { return; }
    const target = document.getElementById(id);
    if (!target || !target.matches('article[data-topic]')) return;
    if (target.hidden) { input.value = ''; filter(); }
    document.querySelectorAll('nav a').forEach(a => {
      if (a.hash === '#' + id) a.setAttribute('aria-current', 'location');
      else a.removeAttribute('aria-current');
    });
    target.scrollIntoView({block:'start'});
  }
  window.addEventListener('hashchange', locate);
  filter();
  if (location.hash) locate();
})();
</script>
</body>
</html>
